<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autolavaggi Verbania</title>
<meta name="description" content="Prezzi e istruzioni dell'autolavaggio in 5 lingue">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0D;--card:#16191E;--line:#2A2F37;--tx:#E6E9ED;--mut:#9AA1AC;--red:#E3262B;--redt:#FF6B6B;--yel:#FFE500}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A0B0D}}
:root[data-theme="dark"]{--bg:#0A0B0D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.45 'Barlow',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:rgba(10,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font:italic 900 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;color:#fff}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{font:700 15px/1 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;min-height:40px;min-width:44px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--yel);border-color:var(--yel);color:#0A0B0D}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
nav a{flex:none;font:700 15px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--tx);text-decoration:none;padding:10px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);min-height:40px;display:flex;align-items:center}
nav a.on{background:#fff;color:#0A0B0D}
h1{font:italic 900 34px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:28px 0 4px;color:#fff;scroll-margin-top:130px}
.kick{font:700 14px/1 'Barlow Condensed',sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
h2{font:800 22px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:22px 0 10px;color:#fff}
section{padding-top:4px}
.prog{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;margin:10px 0}
.pb{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:italic 900 34px/1 'Barlow Condensed',sans-serif;padding:8px 0;gap:4px}
.pb small{font:italic 900 20px/1 'Barlow Condensed',sans-serif}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pn{font:italic 800 21px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#fff;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{font:italic 900 12px/1 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--yel);color:#0A0B0D}
.tag.w{background:#fff;color:#C1121F}
ul{margin:8px 0 0;padding:0;list-style:none}
li{display:flex;gap:9px;align-items:flex-start;padding:2px 0}
li:before{content:"";flex:none;width:7px;height:7px;margin-top:8px;border-radius:2px;background:var(--red)}
.hl{color:var(--redt);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{font:700 14px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border-radius:999px;background:#262B33;color:var(--tx)}
.chip.y{background:var(--yel);color:#0A0B0D}
.chip.g{background:#22A84A;color:#fff}
p{margin:6px 0}
.warn{color:var(--redt);font-weight:700}
.tip{color:#FFD84D;font-weight:600}
.band{border-radius:14px;padding:14px 16px;margin:12px 0;font-weight:600}
.band b{font:800 22px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;display:block;margin-bottom:4px}
.band.r{background:var(--red);color:#fff}
.band.y{background:var(--yel);color:#0A0B0D}
.band.d{background:var(--card);border:1.5px solid var(--red)}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;margin:10px 0}
.num{width:40px;height:40px;border-radius:50%;background:#fff;color:#0A0B0D;display:flex;align-items:center;justify-content:center;font:800 24px/1 'Barlow Condensed',sans-serif}
.dims{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.dim{flex:1 1 90px;text-align:center;background:#fff;color:#0A0B0D;border:7px solid var(--red);border-radius:999px;padding:10px 6px;font:800 22px/1 'Barlow Condensed',sans-serif}
.dim span{display:block;font:700 12px/1 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#4A525E;margin-bottom:4px}
.no li:before{background:none;content:"✕";color:var(--redt);font-weight:800;width:auto;height:auto;margin-top:0}
.legal{font-size:14.5px;color:#C9CDD3;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.legal p{margin:6px 0}
.price{margin-left:auto;font:italic 900 28px/1 'Barlow Condensed',sans-serif;color:#fff}
.variant{display:flex;gap:6px;margin:10px 0}
.variant button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:700 15px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;cursor:pointer;padding:6px}
.variant button[aria-pressed="true"]{background:#fff;color:#0A0B0D}
footer{margin-top:36px;color:var(--mut);font-size:13px;text-align:center}
</style>
</head>
